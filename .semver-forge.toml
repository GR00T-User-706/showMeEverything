# Generated by SemVer Forge from existing project metadata.
# Review the discovery report before changing release policy.
[project]
name = "showMeEverything-cli"
description = "system wide full search engine"

[version]
initial = "3.2.1"
source = { type = "text", file = "VERSION" }

[git]
tag_prefix = "v"
require_clean = true
unknown_commit = "ignore"
merge_commits = "ignore"

[commits]
breaking_changes = true
ignored_types = ["docs", "style", "refactor", "test", "build", "ci", "chore"]
unknown = "ignore"

[commits.types]
feat = "minor"
fix = "patch"
perf = "patch"
revert = "patch"

[sync]
targets = [
    { type = "shell", file = "packaging/arch/cli/PKGBUILD", key = "pkgver" },
    { type = "shell", file = "packaging/arch/gui/PKGBUILD", key = "pkgver" },
]

[release]
commit_version = true
annotated_tag = true
notes_file = "CHANGELOG.md"
require_confirmation = true
release_when_no_changes = false
test_commands = []
build_commands = []
artifact_paths = []
